# MadOS login screen: manual sign-in only.
#
# The greeter never lists accounts and never pre-fills the last
# user: everyone types their username and password. Hiding is
# done by shell, not by username, so it holds for every account
# that exists now or gets created later, on any install, with
# nothing to configure by hand. (The one-off alternative, hiding
# users by name, silently stops working the day a second account
# is created.) Typing a username manually is unaffected.
[Users]
HideShells=/bin/bash,/bin/sh,/bin/dash,/bin/zsh,/bin/fish,/bin/tcsh,/usr/bin/bash,/usr/bin/sh,/usr/bin/dash,/usr/bin/zsh,/usr/bin/fish
RememberLastUser=false
